{
  "comment": [
    "Pinned sibling commits for `make bootstrap PINNED=1` (see script/pin-siblings.sh and README",
    "'Pinned siblings'). The anvil build never uses the live sibling checkouts in this mode: it",
    "compiles read-only `git worktree` snapshots of these commits under .siblings-pinned/, so a",
    "sibling repository that is mid-change cannot break the local chain.",
    "",
    "The default `make bootstrap` (PINNED=0) ignores this file and keeps using the .siblings/",
    "symlinks to the live checkouts - local end-to-end development still sees every sibling edit.",
    "",
    "How to bump: run a clean bootstrap against the live checkouts and only when it fully succeeds",
    "(PINNED=0, `make stop && make clean && make bootstrap`) regenerate this file with",
    "`make pin-lock`. That reads each sibling's HEAD and refuses to run while a sibling working tree",
    "is dirty, so a lock never records a commit that does not describe the code that was built.",
    "Then `make unpin && make pin` and re-run `make bootstrap PINNED=1` to prove the bump.",
    "",
    "Reference: the sha values below are the `sources.*.head` values from the last successful export",
    "(interface-dev-dsh/src/config/abis/manifest.json), i.e. the commits the committed",
    "export/deployments/anvil31337_dev.json was produced from."
  ],
